version: '3.8'

services:
# data chinh
  postgres_db:
    image: postgres:latest
    container_name: my-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ttcs
    ports:
      - "5432:5432"

  # redis
  redis_cache:
    image: redis:latest
    container_name: my-redis
    restart: always
    ports:
      - "6379:6379"
    
